<script>
    const API_URL = "http://localhost:3000/api/portal";

    let state = {
      courses: [],
      ledger: [],
      paid: 38250,
      beds: []
    };

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600', 'text-white');
        btn.classList.add('text-slate-600', 'dark:text-slate-300');
      });
      document.getElementById('tab-' + tabId).classList.remove('hidden');
      const activeBtn = document.getElementById('btn-' + tabId);
      activeBtn.classList.add('bg-indigo-600', 'text-white');
      activeBtn.classList.remove('text-slate-600', 'dark:text-slate-300');
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    let isAdmin = false;
    function toggleAdminMode() {
      isAdmin = !isAdmin;
      const btn = document.getElementById('roleToggleBtn');
      const subtitle = document.getElementById('portalRoleSubtitle');
      if(isAdmin) {
        btn.innerHTML = '<i class="fas fa-user-graduate mr-1"></i> Switch to Student';
        btn.className = "px-3 py-1.5 bg-emerald-700 text-xs font-semibold rounded-lg transition border border-emerald-600 text-white";
        subtitle.innerText = "Administrator Control Panel";
      } else {
        btn.innerHTML = '<i class="fas fa-user-shield mr-1"></i> Switch to Admin';
        btn.className = "px-3 py-1.5 bg-indigo-800 hover:bg-indigo-700 text-xs font-semibold rounded-lg transition border border-indigo-700 text-white";
        subtitle.innerText = "Student Enterprise Portal";
      }
    }

    // Load Data from Node.js Backend Server
    async function loadFromServer() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        state.courses = data.courses;
        state.ledger = data.ledger;
        state.paid = data.paid;
        state.beds = data.beds;

        renderCourses();
        renderLedger();
        renderBeds();
      } catch (err) {
        console.error("Could not connect to Node backend server:", err);
      }
    }

    // Save Data to Node.js Backend Server
    async function saveToServer() {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state)
        });
        const result = await res.json();
        if(result.success) {
          alert("Successfully saved data to your local Node.js server database.json!");
        }
      } catch (err) {
        alert("Error saving data to Node server.");
      }
    }

    function renderCourses() {
      const list = document.getElementById('courseList');
      list.innerHTML = '';
      let credits = 0, count = 0;

      state.courses.forEach((c, idx) => {
        if(c.selected) { credits += c.credits; count++; }
        list.innerHTML += `
          <div class="flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-700/50 rounded-xl border border-slate-200 dark:border-slate-700">
            <div>
              <p class="font-bold">${c.code}: ${c.title}</p>
              <p class="text-xs text-slate-400">${c.credits} Credit Hours</p>
            </div>
            <input type="checkbox" ${c.selected ? 'checked' : ''} onchange="toggleCourse(${idx})" class="h-5 w-5 text-indigo-600 rounded">
          </div>
        `;
      });

      document.getElementById('totalCredits').innerText = `Selected: ${credits} / 24 Credits`;
      document.getElementById('dashRegisteredCount').innerText = `${count} Units`;
    }

    function toggleCourse(index) {
      state.courses[index].selected = !state.courses[index].selected;
      renderCourses();
    }

    function renderLedger() {
      const tbody = document.getElementById('ledgerTable');
      tbody.innerHTML = '';
      state.ledger.forEach(item => {
        const color = item.type === 'paid' ? 'text-emerald-500 font-semibold' : 'font-semibold';
        tbody.innerHTML += `
          <tr>
            <td class="p-3">${item.date}</td>
            <td class="p-3">${item.ref}</td>
            <td class="p-3">${item.desc}</td>
            <td class="p-3 text-right ${color}">${item.amount}</td>
          </tr>
        `;
      });
      const totalFee = 45000;
      const balance = totalFee - state.paid;
      const percent = Math.min(100, Math.round((state.paid / totalFee) * 100));

      document.getElementById('totalPaidText').innerText = `KES ${state.paid.toLocaleString()}`;
      document.getElementById('balanceText').innerText = `KES ${Math.max(0, balance).toLocaleString()}`;
      document.getElementById('dashFeePercent').innerText = `${percent}%`;
      document.getElementById('dashFeeBar').style.width = `${percent}%`;
    }

    async function handleMpesaPay(e) {
      e.preventDefault();
      const btn = document.getElementById('stkBtn');
      const amount = parseInt(document.getElementById('mpesaAmount').value);
      btn.innerText = "Sending STK Push...";
      btn.disabled = true;

      setTimeout(async () => {
        state.paid += amount;
        state.ledger.push({
          date: 'Today',
          ref: 'MPESA' + Math.floor(Math.random()*900000 + 100000),
          desc: 'M-Pesa Deposit',
          amount: `- KES ${amount.toLocaleString()}`,
          type: 'paid'
        });
        renderLedger();
        await saveToServer();
        btn.innerText = "Trigger STK Push";
        btn.disabled = false;
      }, 1500);
    }

    function renderBeds() {
      const grid = document.getElementById('bedGrid');
      grid.innerHTML = '';
      state.beds.forEach((b, idx) => {
        let color = b.status === 'Occupied' ? 'bg-rose-100 text-rose-600 border-rose-300' :
                    b.status === 'Selected' ? 'bg-emerald-100 text-emerald-700 border-emerald-400' :
                    'bg-slate-100 text-slate-700 border-slate-300 hover:border-indigo-500 cursor-pointer';
        grid.innerHTML += `
          <div onclick="selectBed(${idx})" class="p-4 rounded-xl border ${color} text-center font-bold text-sm transition">
            <i class="fas fa-bed text-lg mb-1 block"></i>
            Bed ${b.id}
            <span class="block text-xs font-normal">${b.status}</span>
          </div>
        `;
        if(b.status === 'Selected') {
          document.getElementById('dashHostel').innerText = `Block A - ${b.id}`;
        }
      });
    }

    async function selectBed(index) {
      if(state.beds[index].status === 'Occupied') return;
      state.beds.forEach(b => { if(b.status === 'Selected') b.status = 'Available'; });
      state.beds[index].status = 'Selected';
      renderBeds();
      await saveToServer();
    }

    window.onload = () => {
      loadFromServer();

      const ctx = document.getElementById('gpaChart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['Sem 1.1', 'Sem 1.2', 'Sem 2.1', 'Sem 2.2 (Current)'],
          datasets: [{
            label: 'GPA',
            data: [3.5, 3.65, 3.78, 3.82],
            borderColor: '#4f46e5',
            backgroundColor: 'rgba(79, 70, 229, 0.1)',
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { y: { min: 2.0, max: 4.0 } }
        }
      });
    };
  </script>
